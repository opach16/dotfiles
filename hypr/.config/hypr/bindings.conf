# Application bindings
bind = SUPER, Q, killactive
bind = SUPER, return, exec, uwsm app -- ghostty
bind = SUPER, F, exec, uwsm app -- nautilus --new-window
bind = SUPER, B, exec, uwsm app -- firefox
bind = SUPER SHIFT, B, exec, uwsm app -- firefox --private-window
bind = SUPER, N, exec, uwsm app -- ghostty -e nvim
bind = SUPER, T, exec, uwsm app -- ghostty -e btop
bind = SUPER, D, exec, uwsm app -- ghostty -e lazydocker
bind = SUPER, Y, exec, uwsm app -- ghostty -e yazi
bind = SUPER, E, exec, uwsm app -- thunderbird
bind = SUPER, escape, exec, hyprlock
bind = SUPER, SPACE, exec, walker 
bind = SUPER, V, exec, cliphist list | walker --dmenu | cliphist decode | wl-copy

#Screenshots
bind = SUPER,XF86SelectiveScreenshot, exec, sh -c 'hyprpicker -n | wl-copy'
bind = ,XF86SelectiveScreenshot, exec, screenshot-region
bind = SHIFT,XF86SelectiveScreenshot, exec, screenshot

# Move focus with SUPER + hjkl or arrow keys
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

# Swap active window with the one next to it with SUPER + SHIFT + hjkl or arrow keys
bind = SUPER SHIFT, h, swapwindow, l
bind = SUPER SHIFT, l, swapwindow, r
bind = SUPER SHIFT, k, swapwindow, u
bind = SUPER SHIFT, j, swapwindow, d

# Switch workspaces with mainMod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, S, movetoworkspace, special:magic
#bind = SUPER, K, togglefloating,
#bind = SUPER, J, togglesplit, # dwindle

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
bind = SUPER, TAB, workspace, e+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Volume and brightness
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume 5
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindel = SUPER,XF86AudioRaiseVolume, exec, swayosd-client --output-volume 1
bindel = SUPER,XF86AudioLowerVolume, exec, swayosd-client --output-volume -1
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle 
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle 
bindel = SUPER,XF86MonBrightnessUp, exec, brightnessctl set 1%+
bindel = SUPER,XF86MonBrightnessDown, exec, brightnessctl set 1%-
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness +5
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness -5 
bindel = ,Caps_Lock, exec, swayosd-client --caps-lock

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

