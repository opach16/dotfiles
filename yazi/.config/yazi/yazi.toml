[mgr]
ratio = [1, 2, 3]

[opener]
edit = [
  { run = 'nvim %s', desc = "Edit with Neovim", block = true, for = "unix" },
]

play = [
  { run = 'mpv --force-window %s', desc = "Play with mpv", orphan = true, for = "unix" },
]

pdf = [
  { run = 'zathura %s', desc = "Open PDF with Zathura", block = true, for = "unix" },
]

open = [
  { run = 'xdg-open %s', desc = "Open with system default", for = "linux" },
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/pdf", use = "pdf" },
  { mime = "audio/*", use = "play" },
  { mime = "video/*", use = "play" },
  { url = "*", use = "open" },
]

[preview]
max_width = 4096
max_height = 4096
image_delay = 0
