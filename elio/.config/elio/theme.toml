[palette]

# ----------------------------------------------------------------------------
# App surfaces
# ----------------------------------------------------------------------------

bg = "#121212"
chrome = "#121212"
chrome_alt = "#333333"

panel = "#121212"
panel_alt = "#121212"

surface = "#121212"
elevated = "#333333"

border = "#555555"
path_bg = "#121212"


# ----------------------------------------------------------------------------
# Text
# ----------------------------------------------------------------------------

text = "#BEBEBE"
muted = "#8A8A8D"

chip_text = "#BEBEBE"


# ----------------------------------------------------------------------------
# Controls and states
# ----------------------------------------------------------------------------

accent = "#E68E0D"
accent_soft = "#333333"

accent_text = "#BEBEBE"

selected_bg = "#333333"
selected_border = "#E68E0D"


# ----------------------------------------------------------------------------
# Status markers
# ----------------------------------------------------------------------------

selection_bar = "#E68E0D"
yank_bar = "#FFC107"
cut_bar = "#D35F5F"
progress_bar = "#F59E0B"


# ============================================================================
# CODE PREVIEW
# ============================================================================

[preview.code]

# Keep preview transparent so it inherits the Elio surface.
bg = "none"

# Normal code text
fg = "#BEBEBE"

# Gutter
line_number = "#8A8A8D"

# Current line
line_highlight = "#333333"


# Syntax

comment = "#8A8A8D"

string = "#EAEAEA"

keyword = "#E68E0D"

function = "#F59E0B"

invalid = "#D35F5F"


# ============================================================================
# FILE CLASSES
# ============================================================================

[classes.directory]

icon = "󰉋"
color = "#E68E0D"


[classes.code]

icon = "󰆍"
color = "#F59E0B"


[classes.config]

icon = "󰒓"
color = "#EAEAEA"


# ============================================================================
# RUST
# ============================================================================

[extensions.rs]

class = "code"
icon = ""
color = "#FFC107"


# ============================================================================
# SPECIAL FILES
# ============================================================================

[files."Cargo.toml"]

class = "config"
icon = ""


# ============================================================================
# SPECIAL DIRECTORIES
# ============================================================================

[directories."node_modules"]

icon = "󰏗"
color = "#8A8A8D"
